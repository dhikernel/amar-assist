# Traduz o esquema da requisição para o parâmetro HTTPS do FastCGI, permitindo
# que o mesmo snippet sirva os vhosts HTTP e HTTPS sem condicional.
map $scheme $php_https {
    default off;
    https   on;
}

# -----------------------------------------------------------------------------
# Acesso direto por http://localhost:8000
#
# Mantido como default_server para que o projeto continue rodando sem depender
# de alteração no arquivo hosts da máquina. Quem clona o repositório sobe os
# containers e já acessa; o domínio com SSL é um passo opcional documentado.
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/snippets/laravel.conf;
}

# -----------------------------------------------------------------------------
# amar-assist.site — redireciona todo o tráfego HTTP para HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name amar-assist.site www.amar-assist.site;

    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# amar-assist.site — vhost HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name amar-assist.site www.amar-assist.site;

    ssl_certificate     /etc/nginx/certs/amar-assist.site+1.pem;
    ssl_certificate_key /etc/nginx/certs/amar-assist.site+1-key.pem;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/laravel.conf;
}

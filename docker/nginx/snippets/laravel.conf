# Bloco comum da aplicação, compartilhado entre o vhost HTTP e o HTTPS.
# Mantido em snippet para não duplicar a configuração em dois server blocks —
# duplicar é como se esquece de aplicar um ajuste em um dos dois.

root /var/www/html/public;
index index.php index.html;

charset utf-8;
client_max_body_size 20M;

# Cabeçalhos de segurança básicos
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

error_page 404 /index.php;

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # Sem isso o Laravel não sabe que a conexão é HTTPS (o TLS termina aqui, no
    # nginx) e gera url()/asset() em http://, causando mixed content no browser.
    fastcgi_param HTTPS $php_https;

    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_read_timeout 120;
}

# Bloqueia dotfiles (.env, .git), exceto o desafio ACME
location ~ /\.(?!well-known).* {
    deny all;
}

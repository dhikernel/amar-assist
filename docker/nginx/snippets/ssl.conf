# Parâmetros de TLS.
# O certificado é emitido pelo mkcert e vale só para o ambiente local.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS deliberadamente ausente: o navegador memoriza a diretiva por domínio e
# passaria a exigir HTTPS também em acessos locais por http, inclusive depois
# de o projeto sair do ar. Em produção, com certificado público, faria sentido.
